name: SwiftLint

on:
  pull_request:
    paths:
      - '.github/workflows/swiftlint.yml'
      - '.swiftlint.yml'
      - '**/*.swift'

permissions:
  contents: read
  pull-requests: write

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.0
      - name: swift-lint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:latest \
            lint --reporter checkstyle > swiftlint.xml || true
          sed -i 's|/work/||g' swiftlint.xml
          reviewdog -f=checkstyle -name=SwiftLint \
            -reporter=github-pr-review \
            -level=warning \
            -filter-mode=added \
            < swiftlint.xml